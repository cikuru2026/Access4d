# Blueprint Render : site statique (aucune compilation nécessaire, le dossier public/ est déjà prêt).
services:
  - type: web
    runtime: static
    name: access4d
    staticPublishPath: ./public
    buildCommand: echo "site statique, rien à compiler"
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /downloads/*
        name: Content-Disposition
        value: attachment
